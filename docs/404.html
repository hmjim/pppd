<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление — Точка Опоры</title>
    <link rel="canonical" href="https://hmjim.github.io/pppd/" />
    <meta http-equiv="refresh" content="0;url=https://hmjim.github.io/pppd/" />
    <meta name="robots" content="noindex, follow" />
    <script>
        (function() {
            var ref = document.referrer;
            if (ref) {
                try { sessionStorage.setItem('ym_orig_ref', ref); } catch(e) {}
            }
            window.location.replace('https://hmjim.github.io/pppd/' + window.location.search + window.location.hash);
        })();
    </script>
</head>
<body>
    <p>Страница перемещена. <a href="https://hmjim.github.io/pppd/">Перейти на главную</a></p>
</body>
</html>
