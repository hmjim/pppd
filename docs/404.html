<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление — Точка Опоры</title>
    <link rel="canonical" href="https://hmjim.github.io/pppd/" />
    <meta name="robots" content="noindex, follow" />
    <script>
        (function() {
            var ref = document.referrer;
            if (ref) {
                try { sessionStorage.setItem('ym_orig_ref', ref); } catch(e) {}
            }
            var isEn = window.location.pathname.includes('/en');
            var target = isEn ? 'https://hmjim.github.io/pppd/en/' : 'https://hmjim.github.io/pppd/';
            window.location.replace(target + window.location.search + window.location.hash);
        })();
    </script>
</head>
<body>
    <p>Page moved. <a id="redirect-link" href="https://hmjim.github.io/pppd/">Go to main page</a></p>
    <script>
        var isEn = window.location.pathname.includes('/en');
        var link = document.getElementById('redirect-link');
        if (link) {
            link.href = (isEn ? 'https://hmjim.github.io/pppd/en/' : 'https://hmjim.github.io/pppd/') + window.location.search + window.location.hash;
            if (isEn) link.textContent = 'Go to main page';
        }
    </script>
</body>
</html>
