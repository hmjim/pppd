<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | Точка Опоры</title>
    <meta name="robots" content="noindex, follow" />
    <script>
        // Only redirect legacy /pppd/... paths; real 404s stay on 404 to prevent Google Soft-404 penalties
        (function() {
            var p = window.location.pathname || '';
            if (p === '/pppd' || p.indexOf('/pppd/') === 0) {
                var cleanPath = p.replace(/^\/pppd\/?/, '/');
                window.location.replace('https://pppd.tech' + cleanPath + window.location.search + window.location.hash);
            }
        })();
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 36px 28px;
            border-radius: 14px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 16px 36px rgba(1,4,9,0.75);
        }
        .code {
            font-size: 3rem;
            font-weight: 800;
            color: #58a6ff;
            line-height: 1;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 1.35rem;
            margin: 0 0 10px;
        }
        p {
            color: #9198a1;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0 0 22px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        a.btn {
            display: block;
            background: #238636;
            color: #ffffff;
            padding: 11px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
        }
        a.btn:hover { background: #2ea043; }
        a.btn.sec {
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
        }
        a.btn.sec:hover { border-color: #58a6ff; }
    </style>
</head>
<body>
    <main class="card">
        <div class="code">404</div>
        <h1 id="t-title">Страница не найдена</h1>
        <p id="t-desc">Возможно, ссылка устарела или в адресе опечатка. Все материалы книги «Точка Опоры» доступны ниже:</p>
        <div class="links">
            <a id="l-home" class="btn" href="https://pppd.tech/">На главную страницу →</a>
            <a id="l-intro" class="btn sec" href="https://pppd.tech/chapters/00_introduction.html">Читать с первой главы (бесплатно)</a>
            <a id="l-quiz" class="btn sec" href="https://pppd.tech/chapters/52_dhi_hads_niigata_tests.html#pppd-quiz">Пройти онлайн-тест тяжести ПППГ</a>
        </div>
    </main>
    <script>
        if (window.location.pathname.indexOf('/en') !== -1) {
            document.documentElement.lang = 'en';
            document.title = '404 — Page Not Found | Point of Support';
            document.getElementById('t-title').textContent = 'Page Not Found';
            document.getElementById('t-desc').textContent = 'The link may be outdated or mistyped. Explore the Point of Support recovery guide below:';
            var h = document.getElementById('l-home'); h.href = 'https://pppd.tech/en/'; h.textContent = 'Go to Homepage →';
            var i = document.getElementById('l-intro'); i.href = 'https://pppd.tech/en/chapters/00_introduction.html'; i.textContent = 'Read Free Chapters';
            var q = document.getElementById('l-quiz'); q.href = 'https://pppd.tech/en/chapters/52_dhi_hads_niigata_tests.html#pppd-quiz'; q.textContent = 'Take the 60-Second PPPD Severity Test';
        }
    </script>
</body>
</html>
