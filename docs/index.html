<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Точка Опоры — полное руководство по выходу из ПППГ, невроза и тревожных расстройств. Пошаговая система от человека, который прошёл этот путь сам.">
    <title>Точка Опоры — Выход из ПППГ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Reading progress bar -->
    <div id="progress-bar" class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
    </div>

    <!-- Mobile menu toggle -->
    <button id="menu-toggle" class="menu-toggle" aria-label="Открыть меню">
        <span></span><span></span><span></span>
    </button>

    <!-- Sidebar / Table of Contents -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">Точка Опоры</h2>
            <p class="sidebar-subtitle">Выход из ПППГ</p>
        </div>
        <nav id="toc" class="toc" aria-label="Оглавление"></nav>
        <div class="sidebar-footer">
            <button id="theme-toggle" class="theme-toggle" aria-label="Переключить тему">
                <span class="theme-icon">🌙</span>
            </button>
            <div class="book-progress">
                <span id="progress-text">0%</span> прочитано
            </div>
        </div>
    </aside>

    <!-- Main content area -->
    <main id="content" class="content">
        <article id="chapter" class="chapter">
            <div class="chapter-loading">
                <div class="spinner"></div>
                <p>Загрузка...</p>
            </div>
        </article>

        <!-- Chapter navigation -->
        <nav class="chapter-nav">
            <button id="prev-chapter" class="nav-btn prev-btn" disabled>
                ← Назад
            </button>
            <button id="next-chapter" class="nav-btn next-btn">
                Далее →
            </button>
        </nav>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
