            <h2>Что такое ПППГ?</h2>
            <p>ПППГ — вторая по частоте причина обращений к отоневрологам в мире. Диагностируется у 15-20% пациентов вестибулярных клиник. До 70% людей с ПППГ имеют сопутствующее тревожное расстройство. Среднее время от появления симптомов до правильного диагноза — от 6 месяцев до 3 лет.</p>
